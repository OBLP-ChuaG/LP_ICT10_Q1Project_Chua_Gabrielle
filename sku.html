<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #1a2a48;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #0d1b2a;
        }

        .main {
            max-width: 500px;
            margin: 40px auto;
            background-color: #ffffff;
            color: #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #1d61f2, #8000ff);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .main-body {
            padding: 25px;
        }

        .output {
            background-color: #f8f9fa;
            border: 1px dashed #cccccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #666666;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark px-4">
        <a class="navbar-brand fw-bold" href="#">Skewer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="sku.html"><i class="fa-solid fa-barcode me-1"></i> SKU Generator</a>
            <a class="nav-link" href="index.html"><i class="fa-solid fa-receipt me-1"></i> Receipt Generator</a>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div class="main">
            <div class="header">
                <i class="fa-solid fa-barcode fa-2x mb-2"></i>
                <h4 class="mb-0 fw-bold">SKU Generator</h4>
            </div>
            <div class="main-body">
                <div class="mb-3">
                    <label class="form-label small text-muted"><i class="fa-solid fa-tag me-1"></i> Category</label>
                    <select id="category" class="form-select">
                        <option value="Perishables">Perishables</option>
                        <option value="Beverages">Beverages</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Merchandise">Merchandise</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-muted"><i class="fa-solid fa-box me-1"></i> Product Name</label>
                    <input type="text" id="product_name" class="form-control" placeholder="e.g. Bottled Water">
                </div>

                <div class="mb-3">
                    <label class="form-label small text-muted"><i class="fa-solid fa-warehouse me-1"></i> Stock Quantity</label>
                    <input type="number" id="quantity" class="form-control" placeholder="e.g. 50">
                </div>

                <button class="btn btn-primary w-100 fw-bold py-2" style="background: linear-gradient(135deg, #5b86e5, #36d1dc); border: none;" py-click="SKU_generator">
                    Generate SKU
                </button>

                <div id="sku_output" class="output">Your generated SKU will appear here.</div>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
