<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 PROJECT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #1a2a48;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar {
            background-color: #0d1b2a;
        }

        .main {
            max-width: 500px;
            margin: 40px auto;
            background-color: #ffffff;
            color: #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #1d61f2, #8000ff);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .main-body {
            padding: 25px;
        }

        .output {
            background-color: #f8f9fa;
            border: 1px dashed #cccccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            color: #666666;
            margin-top: 15px;
            white-space: pre-wrap;
            font-family: 'Poppins', monospace;
            font-size: 0.95rem;
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark px-4">
        <a class="navbar-brand fw-bold" href="#">Skewer</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="sku.html"><i class="fa-solid fa-barcode me-1"></i> SKU Generator</a>
            <a class="nav-link active" href="index.html"><i class="fa-solid fa-receipt me-1"></i> Receipt Generator</a>
        </div>
    </nav>

    <div class="container flex-grow-1">
        <div class="main">
            <div class="header">
                <i class="fa-solid fa-mug-hot fa-2x mb-2"></i>
                <h4 class="mb-0 fw-bold">OBMC Entrep Fair</h4>
                <small class="fw-light">Coffee Shop</small>
            </div>
            <div class="main-body">
                <h6 class="fw-bold mb-3"><i class="fa-solid fa-list me-1"></i> Menu</h6>
                
                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="item1" value="99">
                        <label class="form-check-label" for="item1">Americano</label>
                    </div>
                    <span class="fw-bold text-primary">₱99</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="item2" value="129">
                        <label class="form-check-label" for="item2">Spanish Latte</label>
                    </div>
                    <span class="fw-bold text-primary">₱129</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="item3" value="189">
                        <label class="form-check-label" for="item3">Cold Brew Malt</label>
                    </div>
                    <span class="fw-bold text-primary">₱189</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="item4" value="159">
                        <label class="form-check-label" for="item4">Affogato</label>
                    </div>
                    <span class="fw-bold text-primary">₱159</span>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="item5" value="129">
                        <label class="form-check-label" for="item5">Caramel Macchiato</label>
                    </div>
                    <span class="fw-bold text-primary">₱129</span>
                </div>

                <button class="btn btn-primary w-100 fw-bold py-2" py-click="create_order">
                    <i class="fa-solid fa-receipt me-1"></i> Create Order
                </button>

                <div id="show" class="output">Your order summary will appear here.</div>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
